<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<div class="form-container">
	<div class="title-card">
		<h1>Confirm your Adoption!</h1>
	</div>
	
	<h2>Let our pets know their owner!</h2>

	<form id="form" action="confirmation.jsp">
		<table class="form-table">
			<tr>
				<th><label for="name">Full Name</label></th>
				<td><input id="name" name="fullName" type="text" placeholder="Your name here"></td>
			</tr>
			<tr>
				<th><label for="email">Email</label></th>
				<td><input id="email"  name="email" type="email" placeholder="abc@gmail.com"></td>
			</tr>
			<tr>
				<th><label for="phoneNo">Phone Number</label></th>
				<td><input id="phoneNo" name="phone" type="text" placeholder="(+60)12 345 6789"></td>
			</tr>
			<tr>
				<th><label for="petOption">Pet of Interest</label></th>
				<td>
					<select id="petOption" name="petOption">
						<option value="Lucky">Lucky</option>
						<option value="Mochi">Mochi</option>
						<option value="Coco">Coco</option>
						<option value="Oreo">Oreo</option>
						<option value="Peanut">Peanut</option>
						<option value="Snowball">Snowball</option>
					</select>
				</td>
			</tr>
			<tr>
				<th>Housing Type</th>
				<td>
					<label for="apartment" class="housingLabel">
						<input id="apartment" type="radio" name="housingType" value="Apartment/Condominium">
						Apartment/Condominium
					</label>
					<label for="landed" class="housingLabel">
						<input id="landed" type="radio" name="housingType" value="Landed House">
						Landed House
					</label>
					<label for="others" class="housingLabel">
						<input id="others" type="radio" name="housingType" value="Others">
						Others
					</label>
				</td>
			</tr>
			<tr>
				<th><label for="reason">Reason for Adoption</label></th>
				<td><textarea id="reason" name="reason" rows="3" wrap="hard" placeholder="Your reason here"></textarea></td>
			</tr>
		</table>
		
		<label for="agreement">
			<input id="agreement" type="checkbox" name="agreement" value="Agreed">
			I agree to a home visit before the adoption is approved.
		</label>
		
		<input id="submit" type="submit">
	</form>
</div>

<script src="validate.js"></script>

<!-- Show the previously viewed pet when user return to detail page from form page -->
<script>
	const lastPetId=sessionStorage.getItem("lastPetId");
	if(lastPetId) {
		document.getElementById("pet-detail-link").href="detail.html?id="+lastPetId;
	}
</script>
