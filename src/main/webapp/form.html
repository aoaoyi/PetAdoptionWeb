<h1>Confirm your Adoption!</h1>
<div class="formBox">
	<h2>Let our pets know their owner!</h2>
	<form id="form" action="ProcessServlet" method="post">
		<label for="name">Full Name</label>
		<input id="name" name="fullName" type="text" placeholder="Your name here">
		
		<label for="email">Email</label>
		<input id="email"  name="email" type="email" placeholder="abc@gmail.com">
		
		<label for="phoneNo">Phone Number</label>
		<input id="phoneNo" name="phone" type="text" placeholder="(+60)12 345 6789">
		
		<label for="petOption">Pet of Interest</label>
		<select id="petOption" name="petOption">
			<option value="pet1">Pet1</option>
			<option value="pet2">Pet2</option>
			<option value="pet3">Pet3</option>
			<option value="pet4">Pet4</option>
			<option value="pet5">Pet5</option>
			<option value="pet6">Pet6</option>
		</select>
		
		<p>Housing Type</p>
		<label for="apartment" class="housingLabel">
			<input id="apartment" type="radio" name="housingType" value="Apartment/Condominium">
			Apartment/Condominium
		</label>
		<label for="landed" class="housingLabel">
			<input id="landed" type="radio" name="housingType" value="Landed House">
			Landed House
		</label>
		<label for="others" class="housingLabel">
			<input id="others" type="radio" name="housingType" value="Others">
			Others
		</label>
		
		<label for="reason">Reason for Adoption</label>
		<textarea id="reason" name="reason" rows="3" wrap="hard" placeholder="Your reason here"></textarea>
		
		<label for="agreement">
			<input id="agreement" type="checkbox" name="agreement" value="Agreed">
			I agree to a home visit before the adoption is approved.
		</label>
		
		<input id="submit" type="submit">
	</form>
</div>

<footer id="footer">
    <p>Contact Us: Lucky Pets Adoption</p>
    <p>Email: luckypets@gmail.com</p>
    <p>Phone: +60 123456789</p>

    <p>© Lucky Pets, 2026. All Rights Reserved.</p>
</footer>
</body>
</html>
