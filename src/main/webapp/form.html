<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Adoption Form</title>
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="footer.css">
<link rel="stylesheet" href="form.css">
<link rel="stylesheet" href="adaptScreen.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<header>
    <!-- Navigation Bar Home, Our Pets, Adopt, Contact-->
    <nav class="navbar">
        <div class="logo"><img src="image/logo.png" alt="LuckyPets Logo"><span>LuckyPets</span></div>
        <div class="nav-links">
            <a href="index.html"><img src="image/home.png" alt="Home"></a><!-- Go to Home -->
            <a href="list.html"><img src="image/pet.png" alt="Our Pets"></a><!-- Go to PetList -->
            <a href="form.html" class="active"><img src="image/adopt.png" alt="Adopt"></a><!-- Go to AdoptionForm-->
            <a href="#footer"><img src="image/contact.png" alt="Contact"></a><!-- Go to footer -->
        </div>
    </nav>
    <!-- Used to indicate the position for displaying the current page transition -->
    <div class="breadcrumbForForm">
        <a href="index.html">Home</a>
        <span>→</span>
        <a href="list.html">PetList</a>
        <span>→</span>
        <a href="detail.html">PetDetail</a>
        <span>→</span>
        <a href="form.html">AdoptionForm</a>
    </div>
</header>

<div class="form-container">
	<div class="title-card">
		<h1>Confirm your Adoption!</h1>
	</div>
	
	<h2>Let our pets know their owner!</h2>

	<form id="form" action="confirmation.jsp">
		<table class="form-table">
			<tr>
				<th><label for="name">Full Name</label></th>
				<td><input id="name" name="fullName" type="text" placeholder="Your name here"></td>
			</tr>
			<tr>
				<th><label for="email">Email</label></th>
				<td><input id="email"  name="email" type="email" placeholder="abc@gmail.com"></td>
			</tr>
			<tr>
				<th><label for="phoneNo">Phone Number</label></th>
				<td><input id="phoneNo" name="phone" type="text" placeholder="(+60)12 345 6789"></td>
			</tr>
			<tr>
				<th><label for="petOption">Pet of Interest</label></th>
				<td>
					<select id="petOption" name="petOption">
						<option value="pet1">Lucky</option>
						<option value="pet2">Mochi</option>
						<option value="pet3">Coco</option>
						<option value="pet4">Oreo</option>
						<option value="pet5">Peanut</option>
						<option value="pet6">Snowball</option>
					</select>
				</td>
			</tr>
			<tr>
				<th>Housing Type</th>
				<td>
					<label for="apartment" class="housingLabel">
						<input id="apartment" type="radio" name="housingType" value="Apartment/Condominium">
						Apartment/Condominium
					</label>
					<label for="landed" class="housingLabel">
						<input id="landed" type="radio" name="housingType" value="Landed House">
						Landed House
					</label>
					<label for="others" class="housingLabel">
						<input id="others" type="radio" name="housingType" value="Others">
						Others
					</label>
				</td>
			</tr>
			<tr>
				<th><label for="reason">Reason for Adoption</label></th>
				<td><textarea id="reason" name="reason" rows="3" wrap="hard" placeholder="Your reason here"></textarea></td>
			</tr>
		</table>
		
		<label for="agreement">
			<input id="agreement" type="checkbox" name="agreement" value="Agreed">
			I agree to a home visit before the adoption is approved.
		</label>
		
		<input id="submit" type="submit">
	</form>
</div>

<script src="validate.js"></script>

<footer id="footer">
    <p>Contact Us: Lucky Pets Adoption</p>
    <p>Email: luckypets@gmail.com</p>
    <p>Phone: +60 123456789</p>

    <p>© Lucky Pets, 2026. All Rights Reserved.</p>
</footer>
</body>
</html>
