<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lucky Pets</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="footer.css">
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="adaptScreen.css">

</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-lg-5">
            <!-- Logo -->
            <a class="navbar-brand logo" href="index.html">
                <img src="image/logo2.png" alt="LuckyPets Logo">
                <span>LuckyPets</span>
            </a>

            <!-- Hamburger Button -->
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="mainNavbar">
                <div class="nav-links ms-auto">
                    <a href="index.html"class="active">Home</a>
                    <a href="list.html">Our Pets</a>
                    <a href="form.html">Adopt</a>
                    <a href="#footer">Contact</a>
                </div>
            </div>     
        </div>
    </nav>

</header>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<div class="title">
		<img src="image/title.png" alt="Title Image" class="title-image">
		<div class="titleText">
			<span class="large-title">Lucky Pets<br>Adoption Center</span>
			<br/>
			<span class="small-title">Get our pets a new home!</span>
		</div>
	</div>
	
	<div class="viewListButton scroll-reveal" onClick = "location.href='list.html'">
		<button>
			<span class="large-text">Adopt Me Now!</span>
			<br/>
			<span class="small-text">View all pets</span>
		</button>
	</div>
	
	<section class="adoptHighlights scroll-reveal">
		<div class="pet" onClick = "location.href='detail.html?id=pet1'">
			<img src="image/pet1.png" alt = "Pet1">
			<div class="pet-text">
				<label>Hi! I'm Lucky</label>
				<br/>
				<label>I am friendly and gentle, loves playing fetch with kids.</label>
			</div>
		</div>
		<div class="pet" onClick = "location.href='detail.html?id=pet2'">
			<img src="image/pet2.png" alt = "Pet2">
			<div class="pet-text">
				<label>Hi! I'm Mochi</label>
				<br/>
				<label>I am quiet and calm. My favourite spot is by the window.</label>
			</div>
		</div>
		<div class="pet" onClick = "location.href='detail.html?id=pet3'">
			<img src="image/pet3.png" alt = "Pet3">
			<div class="pet-text">
				<label>Hi! I'm Coco</label>
				<br/>
				<label>I am quiet and calm. My favourite spot is by the window.</label>
			</div>
		</div>
	</section>

	<script>
		<!-- Animation for Hightlights -->
		const revealElements=document.querySelectorAll(".scroll-reveal");
	
		const observer=new IntersectionObserver((entries) => {
		    entries.forEach(entry => {
		        if (entry.isIntersecting) {
		            entry.target.classList.add("show");
		            observer.unobserve(entry.target);
		        }
		    });
		}, {threshold: 0.2});
	
		revealElements.forEach(element => {
		    observer.observe(element);
		});
	</script>

<footer id="footer">
    <p>Contact Us: Lucky Pets Adoption</p>
    <p>Email: luckypets@gmail.com</p>
    <p>Phone: +60 123456789</p>

    <p>© Lucky Pets, 2026. All Rights Reserved.</p>
</footer>
</body>
</html>
